services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: parity
      POSTGRES_PASSWORD: ${PARITY_DB_PASSWORD:?Set PARITY_DB_PASSWORD}
      POSTGRES_DB: parity
    ports:
      - "127.0.0.1:${PARITY_DB_PORT:-5432}:5432"
    volumes:
      - parity_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parity -d parity"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb
volumes:
  parity_pg:
